[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-threat-intel"
version = "0.1.0"
description = "AI-Powered Email Threat Detection Platform"
authors = [{name = "Advait"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "eml-parser>=1.17.0",
    "beautifulsoup4>=4.12.0",
    "tldextract>=5.0.0",
    "httpx>=0.27.0",
    "geoip2>=4.8.0",
    "asyncwhois>=1.1.0",
    "dnspython>=2.6.0",
    "checkdmarc>=5.3.0",
    "dkimpy>=1.1.0",
    "authres>=1.2.0",
    "networkx>=3.3",
    "python-louvain>=0.16",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.5.0",
    "transformers>=4.40.0",
    "torch>=2.3.0",
    "sentence-transformers>=3.0.0",
    "python-magic>=0.4.0",
    "confusables>=1.2.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0"
]
